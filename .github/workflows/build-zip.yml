name: Build SwApperPro aus ZIP
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o SwApperPro-App-v3.1-robust*.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: work/SwApperPro-App
      - uses: actions/upload-artifact@v4
        with:
          name: SwApperPro-v3.1-robust
          path: work/SwApperPro-App/app/build/outputs/apk/debug/*.apk
